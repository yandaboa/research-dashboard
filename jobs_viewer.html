<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>live jobs</title>
<style>
  :root {
    --bg: #05060a; --panel: #0a0c14; --rule: #14182a;
    --cyan: #00f0ff; --mag: #ff2bd6; --amber: #ffb000; --dim: #5c6480; --ink: #c9d1e6;
    --mono: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--mono); }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,240,255,0.025) 2px 3px);
  }
  a { color: var(--cyan); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 18px 20px 60px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 10px;
    border-bottom: 1px solid var(--cyan); box-shadow: 0 1px 12px rgba(0,240,255,0.35); margin-bottom: 22px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; color: var(--cyan);
    text-shadow: 0 0 8px rgba(0,240,255,0.7); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
    animation: pulse 1.6s ease-in-out infinite; }
  .dot.stale { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  .age { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .count { color: var(--dim); font-size: 12px; }
  .count b { color: var(--mag); font-weight: 500; }
  .count a { color: var(--dim); text-decoration: none; margin-left: 10px; }
  .count a:hover { color: var(--cyan); }

  section { margin-bottom: 24px; }
  h2 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mag); text-shadow: 0 0 6px rgba(255,43,214,0.5); display: flex; gap: 10px; align-items: baseline; }
  h2 .meta { color: var(--dim); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .scroll { overflow-x: auto; border: 1px solid var(--rule); background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rule);
    vertical-align: middle; }
  th { color: var(--dim); font-weight: 400; font-size: 11px; letter-spacing: 0.1em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(0,240,255,0.04); }
  a.wb { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--cyan); }
  a.wb:hover { color: var(--cyan); text-shadow: 0 0 6px rgba(0,240,255,0.6); }
  td.name { max-width: 360px; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty, .offline { padding: 7px 10px; color: var(--dim); border: 1px dashed var(--rule); font-size: 12px; }
  .offline { color: var(--amber); border-color: rgba(255,176,0,0.4); }
  .st-RUNNING { color: var(--cyan); }
  .st-PENDING { color: var(--amber); }
  .st-COMPLETING { color: var(--mag); }
  .bar { display: inline-block; width: 80px; height: 3px; background: var(--rule); vertical-align: middle;
    margin-left: 8px; }
  .bar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .badge { font-size: 11px; padding: 1px 6px; border: 1px solid var(--rule); color: var(--dim); }
  .badge.ok { color: var(--cyan); border-color: rgba(0,240,255,0.35); }
  .badge.warn { color: var(--amber); border-color: rgba(255,176,0,0.5); }
  .badge.bad { color: var(--mag); border-color: var(--mag); text-shadow: 0 0 6px var(--mag);
    box-shadow: 0 0 8px rgba(255,43,214,0.4); }
  .died { margin-top: 8px; border: 1px solid rgba(255,43,214,0.45); padding: 6px 10px; font-size: 12px; }
  .died .t { color: var(--mag); letter-spacing: 0.12em; font-size: 11px; margin-bottom: 4px; }
  .died .r { display: flex; gap: 12px; flex-wrap: wrap; padding: 2px 0; border-top: 1px dashed var(--rule); }
  .died .r:first-of-type { border-top: 0; }
  .died .r b { color: var(--ink); font-weight: 400; }
  .died .r .why { color: var(--amber); flex: 1 1 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .died .r .dim { color: var(--dim); }
  .gpus { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .gpus b { color: var(--ink); font-weight: 400; }
  details.cap { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 10px; }
  details.cap > summary { cursor: pointer; list-style: none; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--mag); text-shadow: 0 0 6px rgba(255,43,214,0.5); }
  details.cap > summary::-webkit-details-marker { display: none; }
  details.cap > summary::before { content: "[+] "; }
  details.cap[open] > summary::before { content: "[-] "; }
  .cap .cap-note { color: var(--dim); font-size: 11px; margin: 6px 0 2px; }
  .cap .digest { color: var(--dim); text-transform: none; letter-spacing: 0; margin-left: 10px; }
  .cap .body { margin-top: 12px; }
  .cap .cb { margin-bottom: 18px; }
  .cap .h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 6px rgba(0,240,255,0.5); margin-bottom: 5px; }
  .cap table { min-width: 700px; }
  .cap .quota { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 7px;
    font-size: 12px; }
  .cap .quota .lbl { color: var(--dim); }
  .qbar { display: inline-block; width: 200px; height: 6px; background: var(--rule); vertical-align: middle; }
  .qbar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .qbar.warn i { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .qbar.hot i { background: var(--mag); box-shadow: 0 0 6px var(--mag); }
  .cap .meta { color: var(--dim); }
  .cap .free { color: var(--cyan); }
  .cap .zero { color: var(--dim); }
  .cap .dn { color: var(--amber); }
  .err { color: var(--mag); padding: 10px; border: 1px solid var(--mag); margin-bottom: 16px; }
  @media (max-width: 700px) { .wrap { padding: 12px 10px 40px; } td.name { max-width: 200px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="dot"></div>
    <h1>// LIVE JOBS &mdash; tillicum &middot; hyak &middot; delta &middot; local</h1>
    <span class="age" id="age">connecting&hellip;</span>
    <span class="spacer"></span>
    <span class="count" id="count">refresh in <b id="cd">30</b>s <a href="/" title="ledger">&larr; ledger</a></span>
  </header>
  <div id="err" class="err" hidden></div>
  <div id="clusters"></div>
</div>
<script>
"use strict";
const ORDER = ["tillicum", "hyak", "delta", "local"];
const REFRESH_S = 30;
const COLS = ["JOB", "NAME", "STATE", "ELAPSED / LIMIT", "NODE", "ITER", "SUCCESS", "LOG AGE", "BADGE"];
let countdown = REFRESH_S;
let generated = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtAge(s) {
  if (s === null || s === undefined) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function badgeClass(b) {
  if (b === "OK") return "ok";
  if (b === "STALLED" || b === "NO-ITER") return "bad";
  return "warn";
}

function nameLink(j) {
  if (!j.wandb_url) return document.createTextNode(j.name || "—");
  const a = el("a", "wb", j.name || "—");
  a.href = j.wandb_url; a.target = "_blank"; a.rel = "noopener";
  return a;
}
function row(j) {
  const tr = el("tr");
  tr.appendChild(el("td", "", j.job_id));
  const name = el("td", "name");
  name.appendChild(nameLink(j));
  name.title = [j.task, j.log_path].filter(Boolean).join("\n");
  tr.appendChild(name);
  const st = el("td", "st-" + j.state, j.state);
  if (j.partition) st.title = j.partition + (j.gpus ? "  gpu " + j.gpus : "");
  tr.appendChild(st);
  tr.appendChild(el("td", "", (j.elapsed || "0:00") + (j.time_limit ? " / " + j.time_limit : "")));
  tr.appendChild(el("td", "", j.node_list || (j.cluster === "local" ? j.partition : "—")));
  const it = el("td", "num");
  if (j.iteration !== null && j.iteration !== undefined) {
    it.appendChild(document.createTextNode(j.iteration + (j.max_iterations ? "/" + j.max_iterations : "")));
    if (j.max_iterations) {
      const bar = el("span", "bar");
      const fill = el("i");
      fill.style.width = Math.min(100, 100 * j.iteration / j.max_iterations).toFixed(1) + "%";
      bar.appendChild(fill);
      it.appendChild(bar);
    }
  } else it.textContent = "—";
  tr.appendChild(it);
  tr.appendChild(el("td", "num", j.success === null || j.success === undefined ? "—" : j.success.toFixed(3)));
  const age = el("td", "num", fmtAge(j.log_age_s));
  if (j.log_age_s > 900) age.style.color = "var(--amber)";
  tr.appendChild(age);
  const bd = el("td");
  bd.appendChild(el("span", "badge " + badgeClass(j.badge), j.badge));
  tr.appendChild(bd);
  return tr;
}

function section(name, c) {
  const sec = el("section");
  const h = el("h2", "", name);
  if (c) h.appendChild(el("span", "meta", c.ok ? c.jobs.length + " job" + (c.jobs.length === 1 ? "" : "s") : "offline"));
  sec.appendChild(h);
  if (!c) { sec.appendChild(el("div", "empty", "no data")); return sec; }
  if (!c.ok) { sec.appendChild(el("div", "offline", "OFFLINE: " + (c.error || "unknown"))); return sec; }
  if (c.error) sec.appendChild(el("div", "offline", "warn: " + c.error));
  if (!c.jobs.length) sec.appendChild(el("div", "empty", "no jobs"));
  else {
    const scroll = el("div", "scroll");
    const table = el("table");
    const thead = el("thead"), hr = el("tr");
    for (const col of COLS) hr.appendChild(el("th", "", col));
    thead.appendChild(hr); table.appendChild(thead);
    const tbody = el("tbody");
    for (const j of c.jobs) tbody.appendChild(row(j));
    table.appendChild(tbody); scroll.appendChild(table); sec.appendChild(scroll);
  }
  if (c.died && c.died.length) {
    const box = el("div", "died");
    box.appendChild(el("div", "t", "// ENDED WITHOUT TRAINING (24h) — " + c.died.length));
    for (const j of c.died) {
      const r = el("div", "r");
      r.appendChild(el("b", "", j.job_id));
      const nm = el("span"); nm.appendChild(nameLink(j)); nm.title = [j.task, j.log_path].filter(Boolean).join("\n"); r.appendChild(nm);
      r.appendChild(el("span", "dim", j.state + (j.reason ? " " + j.reason : "") + " · " + (j.elapsed || "0:00") +
        " · iter " + (j.iteration === null || j.iteration === undefined ? "none" : j.iteration)));
      const why = el("span", "why", j.error || "no exception found in .out/.err"); why.title = j.error || ""; r.appendChild(why);
      box.appendChild(r);
    }
    sec.appendChild(box);
  }
  if (c.gpus && c.gpus.length) {
    const g = el("div", "gpus");
    g.innerHTML = c.gpus.map((x) => "gpu" + x.index + " <b>" + x.util + "</b> " + x.mem_used + "/" + x.mem_total).join(" &nbsp;&middot;&nbsp; ");
    sec.appendChild(g);
  }
  return sec;
}

const CAP_ORDER = ["tillicum", "hyak", "delta"];
const CAP_COLS = ["PARTITION", "TYPE", "FREE", "USED", "TOTAL", "DOWN",
  "RUNNING j/g", "PENDING j/g", "OTHERS PENDING j/g"];

function capOpen() {
  if (/(^|[?&])cap=1(&|$)/.test(location.search)) return true;
  return localStorage.getItem("cap-open") === "1";
}
function fmtQ(v, unit) {
  if (unit === "USD") return "$" + v.toFixed(2);
  return Math.round(v) + " " + unit;
}
function capDigest(clusters) {
  const bits = [];
  for (const n of CAP_ORDER) {
    const cap = clusters[n] && clusters[n].capacity;
    if (!cap || !cap.ok) continue;
    if (cap.quota) {
      bits.push(n + " " + fmtQ(cap.quota.used, cap.quota.unit) + "/" + fmtQ(cap.quota.total, cap.quota.unit));
    } else if (cap.accounts && cap.accounts.length) {
      let free = 0, total = 0;
      for (const a of cap.accounts) { free += a.free; total += a.total; }
      bits.push(n + " " + free + "/" + total + " gpu free");
    }
  }
  return bits.join(" · ");
}
function quotaRow(q) {
  const div = el("div", "quota");
  div.appendChild(el("span", "lbl", q.label || "quota"));
  const pct = q.total ? 100 * q.used / q.total : 0;
  const bar = el("span", "qbar" + (pct > 90 ? " hot" : pct > 75 ? " warn" : ""));
  const fill = el("i");
  fill.style.width = Math.min(100, Math.max(0, pct)).toFixed(1) + "%";
  bar.appendChild(fill);
  div.appendChild(bar);
  div.appendChild(el("span", "", fmtQ(q.used, q.unit) + " / " + fmtQ(q.total, q.unit) +
    " (" + pct.toFixed(0) + "%)"));
  const meta = [];
  if (q.period) meta.push(q.period);
  if (q.gpu_hours !== null && q.gpu_hours !== undefined) meta.push(q.gpu_hours.toFixed(0) + " gpu h");
  if (q.mine !== null && q.mine !== undefined) {
    meta.push((q.mine_label || "you") + ": " + fmtQ(q.mine, q.unit));
  }
  if (meta.length) div.appendChild(el("span", "meta", meta.join(" · ")));
  return div;
}
function accountsTable(rows) {
  const scroll = el("div", "scroll"), table = el("table");
  const thead = el("thead"), hr = el("tr");
  for (const c of ["ACCOUNT", "PARTITION", "GPUS FREE", "USED", "TOTAL"]) hr.appendChild(el("th", "", c));
  thead.appendChild(hr); table.appendChild(thead);
  const tb = el("tbody");
  for (const a of rows) {
    const tr = el("tr");
    tr.appendChild(el("td", "", a.account));
    tr.appendChild(el("td", "", a.partition));
    tr.appendChild(el("td", "num " + (a.free > 0 ? "free" : "zero"), String(a.free)));
    tr.appendChild(el("td", "num", String(a.used)));
    tr.appendChild(el("td", "num", String(a.total)));
    tb.appendChild(tr);
  }
  table.appendChild(tb); scroll.appendChild(table);
  return scroll;
}
function gpuTable(cap) {
  const byPart = {};
  for (const q of cap.queue || []) byPart[q.partition] = q;
  const scroll = el("div", "scroll"), table = el("table");
  const thead = el("thead"), hr = el("tr");
  for (const c of CAP_COLS) hr.appendChild(el("th", "", c));
  thead.appendChild(hr); table.appendChild(thead);
  const tb = el("tbody");
  let prev = null;
  for (const g of cap.gpus) {
    const tr = el("tr");
    tr.appendChild(el("td", "", g.partition));
    tr.appendChild(el("td", "", g.type));
    tr.appendChild(el("td", "num " + (g.free > 0 ? "free" : "zero"), String(g.free)));
    tr.appendChild(el("td", "num", String(g.used)));
    tr.appendChild(el("td", "num", String(g.total)));
    tr.appendChild(el("td", "num " + (g.down > 0 ? "dn" : "zero"), String(g.down)));
    const q = g.partition === prev ? null : byPart[g.partition];  // queue numbers once per partition
    tr.appendChild(el("td", "num", q ? q.running_jobs + " / " + q.running_gpus : ""));
    tr.appendChild(el("td", "num", q ? q.pending_jobs + " / " + q.pending_gpus : ""));
    tr.appendChild(el("td", "num", q ? q.pending_others_jobs + " / " + q.pending_others_gpus : ""));
    prev = g.partition;
    tb.appendChild(tr);
  }
  table.appendChild(tb); scroll.appendChild(table);
  return scroll;
}
function capBlock(name, cap) {
  const box = el("div", "cb");
  box.appendChild(el("div", "h3", name));
  if (!cap) { box.appendChild(el("div", "empty", "no data")); return box; }
  if (!cap.ok) { box.appendChild(el("div", "offline", "OFFLINE: " + (cap.error || "unknown"))); return box; }
  if (cap.quota) box.appendChild(quotaRow(cap.quota));
  if (cap.accounts && cap.accounts.length) {
    box.appendChild(el("div", "cap-note", "our allocations (hyakalloc)"));
    box.appendChild(accountsTable(cap.accounts));
    box.appendChild(el("div", "cap-note", "cluster-wide (reachable via ckpt)"));
  }
  if (cap.gpus && cap.gpus.length) box.appendChild(gpuTable(cap));
  else box.appendChild(el("div", "empty", "no gpu partitions"));
  return box;
}
function capPanel(clusters) {
  const d = el("details", "cap");
  d.id = "cap";
  d.open = capOpen();
  const sum = el("summary", "", "// CLUSTER CAPACITY & QUOTAS");
  sum.appendChild(el("span", "digest", capDigest(clusters)));
  d.appendChild(sum);
  const body = el("div", "body");
  for (const n of CAP_ORDER) {
    if (!(n in clusters)) continue;
    body.appendChild(capBlock(n, clusters[n].capacity));
  }
  d.appendChild(body);
  d.addEventListener("toggle", () => localStorage.setItem("cap-open", d.open ? "1" : "0"));
  return d;
}

function render(data) {
  const root = document.getElementById("clusters");
  root.textContent = "";
  const clusters = data.clusters || {};
  const names = ORDER.filter((n) => n in clusters).concat(Object.keys(clusters).filter((n) => !ORDER.includes(n)));
  let running = 0, pending = 0;
  for (const n of names) {
    root.appendChild(section(n, clusters[n]));
    for (const j of clusters[n].jobs || []) { if (j.state === "RUNNING") running++; else pending++; }
  }
  root.appendChild(capPanel(clusters));
  document.getElementById("count").firstChild.textContent = running + " running · " + pending + " queued · refresh in ";
  const err = document.getElementById("err");
  err.hidden = !data.error; err.textContent = data.error || "";
  generated = data.generated ? new Date(data.generated) : null;
  if (data.pending) document.getElementById("age").textContent = "first poll in progress…";
  tickAge();
}

function tickAge() {
  const age = document.getElementById("age"), dot = document.getElementById("dot");
  if (!generated) return;
  const s = Math.max(0, Math.round((Date.now() - generated) / 1000));
  age.textContent = "snapshot " + fmtAge(s) + " ago";
  dot.classList.toggle("stale", s > 300);
}

async function refresh() {
  countdown = REFRESH_S;
  try {
    const r = await fetch("/api/jobs", { cache: "no-store" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    render(data);
  } catch (e) {
    document.getElementById("age").textContent = "fetch failed: " + e.message;
    document.getElementById("dot").classList.add("stale");
  }
}

setInterval(() => {
  countdown -= 1;
  document.getElementById("cd").textContent = countdown;
  tickAge();
  if (countdown <= 0) refresh();
}, 1000);
document.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") { if (!e.metaKey && !e.ctrlKey) refresh(); }
});
refresh();
</script>
</body>
</html>
