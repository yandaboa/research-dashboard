<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Dashboard</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&family=Source+Serif+4:wght@400&display=swap"
/>
<style>
  :root {
    color-scheme: light;
    --paper: #f5f4ef;
    --paper-hover: #ebeae5;
    --ink: #000000;
    --muted: #686868;
    --link: #595959;
    --rule: #e5e4dc;
    --edge: #403e37;
    --edge-soft: rgba(64, 62, 55, 0.25);
    --edge-mid: rgba(64, 62, 55, 0.4);
    --tan: #e6e0cb;
    --btn: #d9d8d3;
    --btn-hover: #c4c3bb;
    --gold: #fbd45b;
    --gold-deep: #e0bc4e;
    --s-unreviewed: #686868;
    --s-questionable: #b8860b;
    --s-known_good: #3e6b47;
    --s-planned: #686868;
    --s-running: #b58a2a;
    --s-done: #3e6b47;
    --s-killed: #a6473e;
    --s-failed: #a6473e;
    --s-open: #403e37;
    --s-answered: #3e6b47;
    --s-parked: #8a8677;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* scale the whole UI with display width (readability on large/4k monitors) */
  @media (min-width: 1800px) { body { zoom: 1.15; } }
  @media (min-width: 2400px) { body { zoom: 1.35; } }
  @media (min-width: 3200px) { body { zoom: 1.55; } }
  code, pre, .mono { font-family: var(--mono); }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .label {
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: lowercase;
    color: var(--muted);
  }

  /* ---- two-pane shell ---- */
  .app { display: flex; height: 100%; align-items: stretch; }
  .side {
    width: 312px;
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--paper);
    border-right: 1px solid var(--rule);
  }
  .sidehead { padding: 14px 15px 11px; border-bottom: 1px solid var(--rule); flex: none; }
  .siderow { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .siderow .stamp { white-space: normal; font-size: 10px; line-height: 1.35; }
  nav.nav { flex: 1; min-height: 0; overflow-y: auto; padding: 5px 0 40px; }
  main.detail { flex: 1; min-width: 0; overflow-y: auto; }
  main.detail.feedmode { overflow: hidden; }
  .detailinner { max-width: 880px; margin: 0 auto; padding: 26px 26px 120px; }
  main.detail.feedmode .detailinner {
    max-width: 1120px;
    height: 100%;
    padding: 22px 26px 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .wordmark {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .search {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 4px 8px;
    border: 1px solid var(--edge-soft);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-color: var(--edge); }
  .stamp { color: var(--muted); font-size: 11px; white-space: nowrap; font-family: var(--mono); }
  .btn {
    border: 1px solid var(--edge-soft);
    background: var(--btn);
    border-radius: 3px;
    padding: 3px 10px;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--edge);
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--paper-hover); }

  .filters { margin-top: 9px; }
  .fgroup { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .grouplabel { margin: 0 3px 0 0; flex: none; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--edge-soft);
    background: transparent;
    border-radius: 3px;
    padding: 1px 7px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .chip:hover { background: var(--paper-hover); }
  .chip.on { background: var(--btn); border-color: var(--edge-mid); }
  .chip .cnt { font-family: var(--mono); font-size: 10px; opacity: 0.7; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

  .st-unreviewed { color: var(--s-unreviewed); }
  .st-questionable { color: var(--s-questionable); }
  .st-known_good { color: var(--s-known_good); }
  .st-planned { color: var(--s-planned); }
  .st-running { color: var(--s-running); }
  .st-done { color: var(--s-done); }
  .st-killed { color: var(--s-killed); }
  .st-failed { color: var(--s-failed); }
  .st-open { color: var(--s-open); }
  .st-answered { color: var(--s-answered); }
  .st-parked { color: var(--s-parked); }

  @keyframes pulse {
    0%, 100% { background: var(--gold); opacity: 1; }
    50% { background: var(--gold-deep); opacity: 0.35; }
  }
  .dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes flashfade {
    from { background: rgba(251, 212, 91, 0.5); }
    to { background: transparent; }
  }
  .flash { animation: flashfade 1.6s ease-out; }

  /* ---- question navigation ---- */
  .navitem {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 7px 14px 8px 12px;
  }
  .navitem:hover { background: var(--paper-hover); }
  .navitem.on { background: var(--paper-hover); }
  .navitem.on .navtitle { font-weight: 600; }
  .navitem.muted .navtitle { color: var(--muted); }
  .wtchip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .wtchip .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .navcount .wtchip { margin-right: 6px; }
  .navhead { display: flex; align-items: flex-start; gap: 7px; }
  .navhead .dot { margin-top: 6px; }
  .navglyph { flex: none; width: 6px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .navtitle {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    line-height: 1.35;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .navcount {
    margin: 1px 0 0 13px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .navrule { height: 1px; background: var(--rule); margin: 6px 14px; }
  .navnone { color: var(--muted); font-size: 12px; font-style: italic; padding: 10px 15px; }

  /* ---- feed overview (cropped, never scrolls) ---- */
  .feedgrid { display: flex; gap: 34px; flex: 1; min-height: 0; overflow: hidden; }
  .feedcol { flex: 1; min-width: 0; overflow: hidden; }
  .feeditem {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 4px 4px 5px;
  }
  .feeditem:hover { background: var(--paper-hover); }
  .fititle {
    flex: 0 1 auto;
    max-width: 62%;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fisnip {
    flex: 1 1 auto;
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fitime {
    flex: none;
    margin-left: auto;
    padding-left: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .feednote { flex: none; margin-top: 12px; color: var(--muted); font-size: 11.5px; }

  section.q { margin: 0 0 46px; scroll-margin-top: 18px; }
  .qhead { display: flex; align-items: flex-start; gap: 10px; position: relative; }
  .chev {
    background: none;
    border: none;
    padding: 4px 0 0;
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    width: 12px;
    flex: none;
  }
  .chev:hover { color: var(--ink); }
  .chev .car { display: inline-block; transition: transform 0.15s; }
  .chev.open .car { transform: rotate(90deg); }
  .qmain { flex: 1; min-width: 0; }
  .qtitle {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 25px;
    line-height: 1.2;
    letter-spacing: -0.012em;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .qtitle.unassigned { color: var(--muted); font-size: 21px; }
  .qline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .qid { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .tag {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 6px;
  }
  .statustag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--edge-soft);
    background: transparent;
    border-radius: 3px;
    padding: 1px 7px;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    white-space: nowrap;
  }
  button.statustag:hover { background: var(--paper-hover); border-color: currentColor; }
  .qsummary { margin: 12px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .qfold { margin: 8px 0 0; color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
  .qfold .counts { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .qfold .oneline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  .block { margin-top: 14px; border: 1px solid var(--rule); border-radius: 3px; padding: 8px 11px 9px; }
  .block.conclusion, .block.takeaways { border-left: 2px solid var(--rule); }
  .block.conclusion.filled, .block.takeaways.filled { border-left: 2px solid var(--gold); }
  .blockhead { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .blockhead .grow { flex: 1; }
  .blocktext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
  .blocktext.empty { color: var(--muted); font-style: italic; }
  .iconbtn { background: none; border: none; padding: 0 2px; color: var(--muted); font-size: 12px; line-height: 1; }
  .iconbtn:hover { color: var(--ink); }
  textarea.editor {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--edge-mid);
    border-radius: 3px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    outline: none;
  }
  .editrow { display: flex; gap: 8px; margin-top: 7px; align-items: center; }
  .hint { color: var(--muted); font-size: 10.5px; }

  ul.takeaways { list-style: none; margin: 3px 0 0; padding: 0; font-size: 13.5px; }
  ul.takeaways li { display: flex; gap: 8px; padding: 1px 0; overflow-wrap: anywhere; }
  ul.takeaways li::before { content: "—"; color: var(--gold-deep); flex: none; }

  .assets { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .asset {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 3px;
    padding: 1px 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    max-width: 330px;
  }
  .asset:hover { background: var(--btn); border-color: var(--edge-soft); color: var(--ink); text-decoration: none; }
  .asset .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset .arrow { flex: none; font-size: 10px; opacity: 0.7; }

  /* ---- metric charts ---- */
  .metrics { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .chartbox { margin-top: 14px; border: 1px solid var(--rule); border-radius: 3px; padding: 7px 11px 5px; }
  .metrics .chartbox { margin-top: 0; }
  .charthead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .charthead .grow { flex: 1; min-width: 0; }
  .charthead .dot { align-self: center; }
  .chartstat { font-family: var(--mono); font-size: 15px; line-height: 1.1; color: var(--ink); }
  .chartas { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .chartwrap { position: relative; height: 130px; margin-top: 3px; }
  .chartwrap svg { display: block; }
  .charttip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -100%);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 2px 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--ink);
    white-space: nowrap;
  }
  .charterr { margin-top: 3px; color: var(--muted); font-size: 12px; font-style: italic; }

  .sublist { margin-top: 22px; }
  .sublabel { display: flex; align-items: center; gap: 8px; }
  .sublabel .n { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .sublabel::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .none { color: var(--muted); font-size: 12.5px; font-style: italic; margin-top: 8px; }

  .row {
    position: relative;
    padding: 10px 10px 11px;
    margin: 0 -10px;
    border-bottom: 1px solid var(--rule);
    scroll-margin-top: 24px;
  }
  .row:hover { background: var(--paper-hover); }
  .rowhead { display: flex; align-items: baseline; gap: 9px; }
  .rowhead .rtitle { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
  .rowmeta {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .rowmeta .sep { color: var(--rule); }
  .rowmeta a { color: var(--link); }
  .rsummary { margin-top: 7px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rowline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .filestoggle {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .filestoggle:hover { color: var(--ink); }
  .filestoggle .car { display: inline-block; transition: transform 0.15s; font-size: 9px; }
  .filestoggle.open .car { transform: rotate(90deg); }
  ul.files {
    list-style: none;
    margin: 7px 0 0;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    max-height: 220px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  ul.files li { padding: 1px 0; overflow-wrap: anywhere; }
  button.ref {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 3px;
    padding: 1px 8px;
    font-size: 11.5px;
    color: var(--muted);
    max-width: 330px;
  }
  button.ref:hover { background: var(--btn); border-color: var(--edge-soft); color: var(--ink); }
  button.ref .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .popover {
    position: absolute;
    z-index: 60;
    background: var(--paper);
    border: 1px solid var(--edge-mid);
    border-radius: 3px;
    padding: 3px;
    min-width: 150px;
  }
  .popover button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: none;
    background: none;
    text-align: left;
    padding: 4px 8px;
    border-radius: 2px;
    font-size: 12px;
    color: var(--ink);
  }
  .popover button:hover { background: var(--paper-hover); }
  .popover button .check { margin-left: auto; color: var(--muted); font-size: 10px; }

  .modalbg {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(64, 62, 55, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .modal {
    background: var(--paper);
    border: 1px solid var(--edge-mid);
    border-radius: 3px;
    width: min(1040px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modalhead {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    background: var(--tan);
    border-bottom: 1px solid var(--edge-soft);
  }
  .modalhead .t { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .patch {
    margin: 0;
    padding: 12px 14px;
    overflow: auto;
    font-size: 11.5px;
    line-height: 1.5;
    white-space: pre;
    tab-size: 4;
  }
  .patch .ln { display: block; padding: 0 5px; }
  .patch .add { background: rgba(62, 107, 71, 0.14); color: #2f5a3a; }
  .patch .del { background: rgba(166, 71, 62, 0.12); color: #8f3c34; }
  .patch .hunk { color: var(--s-running); }
  .patch .file { color: var(--ink); font-weight: 500; }
  .patch .dim { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 90px 20px; }
  .empty .glyph { font-family: var(--serif); font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.45; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper);
    border: 1px solid var(--edge-mid);
    border-radius: 3px;
    padding: 6px 14px;
    font-size: 12.5px;
    z-index: 90;
  }
  .toast.err { color: #8f3c34; border-color: #a6473e; }

  @media (max-width: 800px) {
    html, body { height: auto; }
    body { overflow: auto; }
    .app { flex-direction: column; height: auto; }
    .side { width: auto; border-right: none; border-bottom: 1px solid var(--rule); max-height: 48vh; }
    main.detail, main.detail.feedmode { overflow: visible; }
    main.detail.feedmode .detailinner { height: auto; overflow: visible; }
    .feedgrid { flex-direction: column; gap: 18px; overflow: visible; }
    .feedcol { overflow: visible; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="sidehead">
      <div class="wordmark">Research Dashboard</div>
      <input id="search" class="search" type="search" placeholder="search questions, diffs, runs…   ( / )" />
      <div class="filters" id="filters"></div>
      <div class="siderow">
        <button id="refresh" class="btn ghost" title="reload from disk">refresh</button>
        <span id="stamp" class="stamp">loading…</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="detail" id="detail"></main>
</div>
<script>
"use strict";

const STATUS_DEFS = {
  question: [
    { key: "open", label: "open" },
    { key: "answered", label: "answered" },
    { key: "parked", label: "parked" },
  ],
  diff: [
    { key: "unreviewed", label: "unreviewed" },
    { key: "questionable", label: "questionable" },
    { key: "known_good", label: "known good" },
  ],
  experiment: [
    { key: "planned", label: "planned" },
    { key: "running", label: "running" },
    { key: "done", label: "done" },
    { key: "killed", label: "killed" },
    { key: "failed", label: "failed" },
  ],
};
const LABEL_OF = {};
for (const kind of Object.keys(STATUS_DEFS)) {
  for (const def of STATUS_DEFS[kind]) LABEL_OF[kind + ":" + def.key] = def.label;
}

const UNASSIGNED = "__unassigned__";
const FEED_LIMIT = 20;

const state = {
  questions: [],
  diffs: [],
  experiments: [],
  byId: new Map(),
  generated: "",
  search: "",
  filters: { question: new Set(), diff: new Set(), experiment: new Set() },
  openFiles: new Set(),
  collapsed: new Set(),
  metricsCache: new Map(), // exp id -> payload from /api/metrics/<id>, or null when there is none

  editing: null,
  selected: null, // null = feed overview, else question id or UNASSIGNED
  error: "",
};

const detailEl = document.getElementById("detail");
const navEl = document.getElementById("nav");
const stampEl = document.getElementById("stamp");
const filtersEl = document.getElementById("filters");
const searchEl = document.getElementById("search");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function labelOf(entry) {
  return LABEL_OF[entry.kind + ":" + entry.status] || entry.status || "?";
}
function statusClass(entry) {
  return "st-" + (entry.status || "unreviewed");
}
function qidOf(entry) {
  return entry.question_id || null;
}
function titleOf(entry) {
  return (entry && entry.title) || "untitled";
}
function fmtStamp(iso) {
  if (!iso) return "";
  return String(iso).replace("T", " ").slice(0, 16);
}
function relStamp(iso) {
  if (!iso) return "";
  const then = Date.parse(String(iso));
  if (Number.isNaN(then)) return fmtStamp(iso).slice(0, 10);
  const secs = (Date.now() - then) / 1000;
  if (secs < 90) return "now";
  if (secs < 3600) return Math.round(secs / 60) + "m";
  if (secs < 86400) return Math.round(secs / 3600) + "h";
  if (secs < 86400 * 14) return Math.round(secs / 86400) + "d";
  return fmtStamp(iso).slice(0, 10);
}
function firstLine(text) {
  const line = String(text || "").split("\n").find((l) => l.trim());
  return line ? line.trim() : "";
}
function listField(entry, field) {
  const raw = entry[field];
  return Array.isArray(raw) ? raw.filter((v) => typeof v === "string" && v.trim()) : [];
}
function assetsOf(entry) {
  return Array.isArray(entry.assets) ? entry.assets.filter((a) => a && a.location) : [];
}
function plural(n, word) {
  return n + " " + word + (n === 1 ? "" : "s");
}
function metricSpecsOf(entry) {
  return Array.isArray(entry.metrics) ? entry.metrics.filter((m) => m && m.key) : [];
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try {
      const body = await res.json();
      if (body && body.error) msg = body.error;
    } catch (e) { /* non-json error body */ }
    throw new Error(msg);
  }
  return res;
}

let toastTimer = null;
function toast(msg, isError) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const node = el("div", "toast" + (isError ? " err" : ""), msg);
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.remove(), 2600);
}

async function loadData(showToast) {
  try {
    const res = await api("/api/data");
    const data = await res.json();
    const tag = (list, kind) => (list || []).map((e) => Object.assign({ kind: kind }, e));
    const byUpdated = (a, b) => String(b.updated || "").localeCompare(String(a.updated || ""));
    state.questions = tag(data.questions, "question").sort(byUpdated);
    state.diffs = tag(data.diffs, "diff").sort(byUpdated);
    state.experiments = tag(data.experiments, "experiment").sort(byUpdated);
    state.byId = new Map();
    for (const e of state.questions.concat(state.diffs, state.experiments)) state.byId.set(e.id, e);
    state.generated = data.generated || "";
    state.error = "";
    if (showToast) toast("reloaded " + state.byId.size + " entries");
  } catch (err) {
    state.error = String(err.message || err);
    toast("load failed: " + state.error, true);
  }
  refreshMetrics();
  render();
}

function matchesSearch(entry) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  const parts = [
    entry.id,
    entry.title,
    entry.summary,
    entry.conclusion,
    entry.results,
    entry.notes,
    entry.repo,
    entry.worktree,
    entry.branch,
    entry.cluster,
    (entry.tags || []).join(" "),
    (entry.commits || []).join(" "),
    (entry.job_ids || []).join(" "),
    listField(entry, "takeaways").join("   "),
    assetsOf(entry).map((a) => (a.label || "") + " " + a.location).join("   "),
    metricSpecsOf(entry).map((m) => (m.label || "") + " " + (m.key || "")).join("   "),
  ];
  const hay = parts.filter(Boolean).join("   ").toLowerCase();
  return q.split(/\s+/).every((tok) => hay.includes(tok));
}

function passesStatus(entry) {
  const set = state.filters[entry.kind];
  return !set || !set.size || set.has(entry.status);
}

function childrenOf(qid) {
  return {
    diffs: state.diffs.filter((d) => qidOf(d) === qid),
    exps: state.experiments.filter((e) => qidOf(e) === qid),
  };
}

function looseChildren() {
  const known = new Set(state.questions.map((q) => q.id));
  const loose = (entry) => !known.has(qidOf(entry) || "");
  return {
    diffs: state.diffs.filter((d) => loose(d) && passesStatus(d) && matchesSearch(d)),
    exps: state.experiments.filter((e) => loose(e) && passesStatus(e) && matchesSearch(e)),
  };
}

function questionKeyOf(entry) {
  const qid = entry ? qidOf(entry) : null;
  return qid && state.byId.has(qid) ? qid : UNASSIGNED;
}

function anyFilterActive() {
  return state.filters.question.size || state.filters.diff.size || state.filters.experiment.size;
}

// ---- selection / hash routing -------------------------------------------------

function hashKey() {
  const raw = decodeURIComponent(String(location.hash || "").replace(/^#/, "")).trim();
  if (!raw) return null;
  return raw === "unassigned" ? UNASSIGNED : raw;
}
function hashFor(key) {
  if (!key) return "";
  return key === UNASSIGNED ? "#unassigned" : "#" + encodeURIComponent(key);
}
function setSelected(key) {
  state.selected = key || null;
  const want = hashFor(state.selected);
  if (String(location.hash || "") !== want) {
    if (want) location.hash = want;
    else history.replaceState(null, "", location.pathname + location.search);
  }
  render();
}
window.addEventListener("hashchange", () => {
  const key = hashKey();
  if (key === state.selected) return;
  state.selected = key;
  render();
});

function renderFilters() {
  filtersEl.textContent = "";
  const counts = new Map();
  for (const e of state.byId.values()) {
    if (!matchesSearch(e)) continue;
    counts.set(e.kind + ":" + e.status, (counts.get(e.kind + ":" + e.status) || 0) + 1);
  }
  const group = (label, kind) => {
    const row = el("div", "fgroup");
    row.appendChild(el("span", "label grouplabel", label));
    const set = state.filters[kind];
    for (const def of STATUS_DEFS[kind]) {
      const btn = el("button", "chip " + "st-" + def.key + (set.has(def.key) ? " on" : ""));
      btn.appendChild(el("span", "dot"));
      btn.appendChild(el("span", null, def.label));
      btn.appendChild(el("span", "cnt", String(counts.get(kind + ":" + def.key) || 0)));
      btn.onclick = () => {
        if (set.has(def.key)) set.delete(def.key);
        else set.add(def.key);
        render();
      };
      row.appendChild(btn);
    }
    filtersEl.appendChild(row);
  };
  group("questions", "question");
  group("diffs", "diff");
  group("runs", "experiment");
  if (anyFilterActive() || state.search) {
    const row = el("div", "fgroup");
    const clear = el("button", "btn ghost", "clear");
    clear.onclick = () => {
      state.filters.question.clear();
      state.filters.diff.clear();
      state.filters.experiment.clear();
      state.search = "";
      searchEl.value = "";
      render();
    };
    row.appendChild(clear);
    filtersEl.appendChild(row);
  }
}

function closePopovers() {
  document.querySelectorAll(".popover").forEach((p) => p.remove());
}
document.addEventListener("click", () => closePopovers());

function openStatusPopover(anchor, entry) {
  const existing = document.querySelector(".popover");
  closePopovers();
  if (existing && existing.dataset.for === entry.id) return;
  const pop = el("div", "popover");
  pop.dataset.for = entry.id;
  for (const def of STATUS_DEFS[entry.kind]) {
    const btn = el("button");
    btn.appendChild(el("span", "dot st-" + def.key));
    btn.appendChild(el("span", null, def.label));
    if (entry.status === def.key) btn.appendChild(el("span", "check", "✓"));
    btn.onclick = (ev) => {
      ev.stopPropagation();
      closePopovers();
      if (def.key === entry.status) return;
      const prev = entry.status;
      entry.status = def.key;
      render();
      pushUpdate(entry.id, { status: def.key }, () => {
        entry.status = prev;
        render();
      });
    };
    pop.appendChild(btn);
  }
  const host = anchor.closest(".row") || anchor.closest(".qhead");
  if (!host) return;
  host.appendChild(pop);
  const hr = host.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  pop.style.top = ar.bottom - hr.top + 5 + "px";
  pop.style.left = Math.max(0, ar.left - hr.left) + "px";
}

function statusTag(entry, editable) {
  const tag = el(editable ? "button" : "span", "statustag " + statusClass(entry));
  const pulsing = entry.kind === "experiment" && entry.status === "running";
  tag.appendChild(el("span", "dot" + (pulsing ? " pulse" : "")));
  tag.appendChild(el("span", null, labelOf(entry)));
  if (editable) {
    tag.title = "click to change status";
    tag.onclick = (ev) => {
      ev.stopPropagation();
      openStatusPopover(tag, entry);
    };
  }
  return tag;
}

async function pushUpdate(id, fields, onError) {
  try {
    const res = await api("/api/update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, fields: fields }),
    });
    const updated = await res.json();
    const current = state.byId.get(id);
    if (current) Object.assign(current, updated);
    render();
  } catch (err) {
    toast("save failed: " + (err.message || err), true);
    if (onError) onError();
  }
}

function scrollToEntry(id) {
  const entry = state.byId.get(id);
  const key = questionKeyOf(entry);
  if (state.collapsed.has(key)) state.collapsed.delete(key);
  if (state.selected !== key) setSelected(key);
  else render();
  const node = document.getElementById("row-" + id);
  if (!node) {
    toast("that entry is hidden by the current filters", true);
    return;
  }
  node.scrollIntoView({ behavior: "smooth", block: "center" });
  node.classList.remove("flash");
  void node.offsetWidth;
  node.classList.add("flash");
}

function refChip(entry) {
  const btn = el("button", "ref");
  btn.appendChild(el("span", "dot " + (entry ? statusClass(entry) : "st-unreviewed")));
  btn.appendChild(el("span", "txt", entry ? titleOf(entry) : "missing entry"));
  btn.title = entry ? labelOf(entry) : "referenced entry is missing";
  if (!entry) return btn;
  btn.onclick = (ev) => {
    ev.stopPropagation();
    scrollToEntry(entry.id);
  };
  return btn;
}

// asList: the field is a list of strings edited as one-per-line text (takeaways).
function editableBlock(entry, field, label, extraClass, asList) {
  const box = el("div", "block" + (extraClass ? " " + extraClass : ""));
  const items = asList ? listField(entry, field) : null;
  const value = asList ? items.join("\n") : entry[field] || "";
  if ((extraClass === "conclusion" || extraClass === "takeaways") && value) box.classList.add("filled");
  const head = el("div", "blockhead");
  head.appendChild(el("span", "label grow", label));
  const editKey = entry.id + ":" + field;

  if (state.editing && state.editing.key === editKey) {
    const ta = el("textarea", "editor");
    ta.value = state.editing.value !== null ? state.editing.value : value;
    if (asList) ta.placeholder = "one takeaway per line";
    ta.oninput = () => {
      state.editing.value = ta.value;
    };
    const save = () => {
      const next = asList
        ? ta.value.split("\n").map((l) => l.trim()).filter(Boolean)
        : ta.value;
      state.editing = null;
      const prev = entry[field];
      entry[field] = next;
      render();
      pushUpdate(entry.id, { [field]: next }, () => {
        entry[field] = prev;
        render();
      });
    };
    ta.onkeydown = (ev) => {
      if (ev.key === "Escape") {
        state.editing = null;
        render();
      } else if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) {
        save();
      }
    };
    box.appendChild(head);
    box.appendChild(ta);
    const row = el("div", "editrow");
    const saveBtn = el("button", "btn", "save");
    saveBtn.onclick = save;
    const cancel = el("button", "btn ghost", "cancel");
    cancel.onclick = () => {
      state.editing = null;
      render();
    };
    row.appendChild(saveBtn);
    row.appendChild(cancel);
    const hint = (asList ? "one per line · " : "") + "⌘/Ctrl+Enter saves · Esc cancels";
    row.appendChild(el("span", "hint", hint));
    box.appendChild(row);
    setTimeout(() => {
      // never steal focus from the search box when a re-render happens with an editor open
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }, 0);
    return box;
  }

  const edit = el("button", "iconbtn", "✎");
  edit.title = "edit " + field;
  edit.onclick = (ev) => {
    ev.stopPropagation();
    state.editing = { key: editKey, value: value };
    render();
  };
  head.appendChild(edit);
  box.appendChild(head);
  if (asList && items.length) {
    const list = el("ul", "takeaways");
    for (const item of items) list.appendChild(el("li", null, item));
    box.appendChild(list);
  } else {
    box.appendChild(el("div", "blocktext" + (value ? "" : " empty"), value || "— none —"));
  }
  return box;
}

function assetsLine(entry) {
  const assets = assetsOf(entry);
  if (!assets.length) return null;
  const line = el("div", "assets");
  line.appendChild(el("span", "label", "assets"));
  for (const asset of assets) {
    const loc = String(asset.location);
    const text = String(asset.label || loc);
    const lower = loc.toLowerCase();
    if (lower.startsWith("http://") || lower.startsWith("https://")) {
      const link = document.createElement("a");
      link.className = "asset";
      link.href = loc;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.title = loc;
      link.appendChild(el("span", "txt", text));
      link.appendChild(el("span", "arrow", "↗"));
      line.appendChild(link);
    } else {
      const btn = el("button", "asset");
      btn.title = loc + " — click to copy";
      btn.appendChild(el("span", "txt", text));
      btn.appendChild(el("span", "arrow", "⧉"));
      btn.onclick = (ev) => {
        ev.stopPropagation();
        copyLocation(loc);
      };
      line.appendChild(btn);
    }
  }
  return line;
}

function copyLocation(loc) {
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    toast("clipboard unavailable", true);
    return;
  }
  navigator.clipboard.writeText(loc).then(
    () => toast("copied " + loc),
    () => toast("copy failed", true)
  );
}

// ---- metric charts ------------------------------------------------------------
// One chart per metric key; series identity is carried by a direct end label, never by color alone.

const SVGNS = "http://www.w3.org/2000/svg";
const SERIES_COLORS = ["#403E37", "#B58A2A", "#3E6B47", "#A6473E"];
const CHART_H = 130;
const metricsInflight = new Set();

function svgEl(tag, attrs) {
  const node = document.createElementNS(SVGNS, tag);
  for (const key of Object.keys(attrs || {})) node.setAttribute(key, String(attrs[key]));
  return node;
}

function fmtMetric(v) {
  if (typeof v !== "number" || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a === 0) return "0";
  if (a >= 1e5 || a < 1e-3) return v.toExponential(2);
  if (a >= 100) return v.toFixed(1);
  return v.toFixed(3);
}
function fmtStep(v) {
  if (typeof v !== "number" || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a % 1e6 ? 1 : 0) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(a % 1e3 ? 1 : 0) + "k";
  return String(Math.round(v));
}
function runIdOf(url) {
  const parts = String(url || "").split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "run";
}
function normPoints(series) {
  const raw = Array.isArray(series.points) ? series.points : [];
  const points = raw
    .filter((p) => Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number")
    .filter((p) => isFinite(p[0]) && isFinite(p[1]))
    .map((p) => [p[0], p[1]]);
  points.sort((a, b) => a[0] - b[0]);
  return points;
}
function latestOf(series, points) {
  if (typeof series.latest === "number" && isFinite(series.latest)) return series.latest;
  return points.length ? points[points.length - 1][1] : null;
}
function runStateClass(runState) {
  if (runState === "running") return "st-running";
  if (runState === "finished") return "st-done";
  if (runState === "crashed" || runState === "failed") return "st-killed";
  return "st-unreviewed";
}
function seriesTag(series, group) {
  const labels = group.map((s) => String(s.label || ""));
  const label = String(series.label || "");
  if (label && labels.filter((l) => l === label).length === 1) return label;
  return runIdOf(series.run_url);
}
function chartLabel(key, group) {
  const first = group.find((s) => s.label);
  if (first) return String(first.label);
  const parts = String(key).split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : String(key);
}

let renderTimer = null;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => {
    renderTimer = null;
    const active = document.activeElement;
    if (state.editing || (active && active.tagName === "TEXTAREA")) return;
    render();
  }, 0);
}

function fetchMetrics(id, force) {
  if (metricsInflight.has(id)) return;
  if (!force && state.metricsCache.has(id)) return;
  metricsInflight.add(id);
  const done = (payload) => {
    metricsInflight.delete(id);
    const before = state.metricsCache.has(id) ? JSON.stringify(state.metricsCache.get(id)) : null;
    state.metricsCache.set(id, payload);
    if (JSON.stringify(payload) !== before) scheduleRender();
  };
  fetch("/api/metrics/" + encodeURIComponent(id), { cache: "no-store" })
    .then((res) => (res.ok ? res.json() : null)) // 404 -> "none"
    .then((data) => done(data && Array.isArray(data.series) ? data : null))
    .catch(() => done(null));
}

function refreshMetrics() {
  for (const id of Array.from(state.metricsCache.keys())) fetchMetrics(id, true);
}

function chartBox(key, group, fetched) {
  const box = el("div", "chartbox");
  const drawn = group
    .map((s) => ({ series: s, points: normPoints(s) }))
    .filter((s) => s.points.length);

  const head = el("div", "charthead");
  head.appendChild(el("span", "label grow", chartLabel(key, group)));
  const stat = drawn.length ? latestOf(drawn[0].series, drawn[0].points) : null;
  if (stat !== null) head.appendChild(el("span", "chartstat", fmtMetric(stat)));
  for (const s of group) {
    const running = s.run_state === "running";
    const dot = el("span", "dot " + runStateClass(s.run_state) + (running ? " pulse" : ""));
    dot.title = seriesTag(s, group) + " · " + (s.run_state || "unknown state");
    head.appendChild(dot);
  }
  if (fetched) {
    const as = el("span", "chartas", "as of " + fmtStamp(fetched));
    as.title = String(fetched);
    head.appendChild(as);
  }
  box.appendChild(head);

  if (drawn.length) {
    const wrap = el("div", "chartwrap");
    wrap.__chart = {
      series: drawn.map((s, i) => ({
        tag: seriesTag(s.series, group),
        color: SERIES_COLORS[i % SERIES_COLORS.length],
        points: s.points,
      })),
    };
    box.appendChild(wrap);
  }
  for (const s of group) {
    if (s.error) box.appendChild(el("div", "charterr", "metric fetch failed: " + s.error));
  }
  if (!drawn.length && !group.some((s) => s.error)) box.appendChild(el("div", "charterr", "no points logged yet"));
  return box;
}

function metricsBlock(entry) {
  const specs = metricSpecsOf(entry);
  if (Array.isArray(entry.metrics) && !specs.length) return null; // explicitly no metrics: no box at all
  if (!state.metricsCache.has(entry.id)) {
    fetchMetrics(entry.id, false);
    return null;
  }
  const payload = state.metricsCache.get(entry.id);
  if (!payload) return null;
  const series = (payload.series || []).filter((s) => s && s.key);
  if (!series.length) return null;

  const groups = new Map();
  for (const s of series) {
    const key = String(s.key);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  const box = el("div", "metrics");
  for (const [key, group] of groups) box.appendChild(chartBox(key, group, payload.fetched));
  return box;
}

function nearestPoint(points, x) {
  let best = null;
  let bestDist = Infinity;
  for (const p of points) {
    const d = Math.abs(p[0] - x);
    if (d < bestDist) {
      bestDist = d;
      best = p;
    }
  }
  return best;
}

function drawChart(wrap) {
  const spec = wrap.__chart;
  if (!spec) return;
  const width = Math.round(wrap.clientWidth);
  if (width < 120) return;
  if (wrap.__drawnAt === width) return;
  wrap.__drawnAt = width;
  wrap.textContent = "";

  const multi = spec.series.length > 1;
  const pad = { l: 46, r: multi ? 66 : 18, t: 12, b: 18 };
  const plotW = Math.max(20, width - pad.l - pad.r);
  const plotH = Math.max(20, CHART_H - pad.t - pad.b);
  let xmin = Infinity;
  let xmax = -Infinity;
  let ymin = Infinity;
  let ymax = -Infinity;
  for (const s of spec.series) {
    for (const p of s.points) {
      if (p[0] < xmin) xmin = p[0];
      if (p[0] > xmax) xmax = p[0];
      if (p[1] < ymin) ymin = p[1];
      if (p[1] > ymax) ymax = p[1];
    }
  }
  if (!isFinite(xmin) || !isFinite(ymin)) return;
  if (xmax === xmin) xmax = xmin + 1;
  const span = ymax - ymin;
  const padY = span > 0 ? span * 0.05 : Math.max(Math.abs(ymax) * 0.05, 0.5);
  const y0 = ymin - padY;
  const y1 = ymax + padY;
  const sx = (v) => pad.l + ((v - xmin) / (xmax - xmin)) * plotW;
  const sy = (v) => pad.t + (1 - (v - y0) / (y1 - y0)) * plotH;

  const svg = svgEl("svg", { width: width, height: CHART_H, viewBox: "0 0 " + width + " " + CHART_H });
  for (const frac of [0, 0.5, 1]) {
    const y = pad.t + plotH * frac;
    svg.appendChild(
      svgEl("line", {
        x1: pad.l,
        y1: y,
        x2: pad.l + plotW,
        y2: y,
        style: "stroke: var(--rule); stroke-width: 1",
        "shape-rendering": "crispEdges",
      })
    );
  }

  const tickStyle = "fill: var(--muted); font-family: var(--mono); font-size: 10px";
  const tick = (x, y, text, anchor) => {
    const node = svgEl("text", { x: x, y: y, "text-anchor": anchor, style: tickStyle });
    node.textContent = text;
    svg.appendChild(node);
  };
  tick(pad.l - 7, pad.t + 3, fmtMetric(y1), "end");
  tick(pad.l - 7, pad.t + plotH + 3, fmtMetric(y0), "end");
  tick(pad.l, CHART_H - 4, fmtStep(xmin), "start");
  tick(pad.l + plotW, CHART_H - 4, fmtStep(xmax), "end");

  for (const s of spec.series) {
    const d = s.points.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
    svg.appendChild(
      svgEl("path", {
        d: d,
        fill: "none",
        stroke: s.color,
        "stroke-width": 2,
        "stroke-linejoin": "round",
        "stroke-linecap": "round",
      })
    );
    const last = s.points[s.points.length - 1];
    svg.appendChild(svgEl("circle", { cx: sx(last[0]), cy: sy(last[1]), r: 3.5, fill: s.color }));
    if (multi) {
      const label = svgEl("text", {
        x: Math.min(sx(last[0]) + 7, width - 2),
        y: Math.min(Math.max(sy(last[1]) + 3.5, pad.t + 4), pad.t + plotH),
        style: "fill: " + s.color + "; font-family: var(--mono); font-size: 10px",
      });
      label.textContent = s.tag;
      svg.appendChild(label);
    }
  }

  const cross = svgEl("line", {
    x1: pad.l,
    y1: pad.t,
    x2: pad.l,
    y2: pad.t + plotH,
    style: "stroke: var(--edge-mid); stroke-width: 1",
    "shape-rendering": "crispEdges",
    visibility: "hidden",
  });
  svg.appendChild(cross);
  const markers = spec.series.map((s) => {
    const dot = svgEl("circle", { r: 2.5, fill: s.color, visibility: "hidden" });
    svg.appendChild(dot);
    return dot;
  });
  wrap.appendChild(svg);

  const tip = el("div", "charttip");
  tip.style.display = "none";
  wrap.appendChild(tip);
  const hide = () => {
    cross.setAttribute("visibility", "hidden");
    for (const m of markers) m.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  };
  svg.addEventListener("mousemove", (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = Math.min(Math.max(ev.clientX - rect.left, pad.l), pad.l + plotW);
    const xv = xmin + ((px - pad.l) / plotW) * (xmax - xmin);
    const near = spec.series.map((s) => nearestPoint(s.points, xv));
    const anchor = near.find(Boolean);
    if (!anchor) {
      hide();
      return;
    }
    spec.series.forEach((s, i) => {
      const p = near[i];
      if (!p) {
        markers[i].setAttribute("visibility", "hidden");
        return;
      }
      markers[i].setAttribute("cx", String(sx(p[0])));
      markers[i].setAttribute("cy", String(sy(p[1])));
      markers[i].setAttribute("visibility", "visible");
    });
    cross.setAttribute("x1", String(sx(anchor[0])));
    cross.setAttribute("x2", String(sx(anchor[0])));
    cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    if (multi) {
      tip.appendChild(el("div", null, fmtStep(anchor[0])));
      spec.series.forEach((s, i) => {
        if (near[i]) tip.appendChild(el("div", null, s.tag + " · " + fmtMetric(near[i][1])));
      });
    } else {
      tip.appendChild(el("div", null, fmtStep(anchor[0]) + " · " + fmtMetric(anchor[1])));
    }
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max(sx(anchor[0]), 46), width - 46) + "px";
    tip.style.top = Math.max(16, sy(anchor[1]) - 7) + "px";
  });
  svg.addEventListener("mouseleave", hide);
}

function drawCharts() {
  document.querySelectorAll(".chartwrap").forEach(drawChart);
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawCharts, 120);
});

function metaText(node, text) {
  node.appendChild(el("span", null, text));
}
function metaSep(node) {
  node.appendChild(el("span", "sep", "·"));
}

function diffRow(entry) {
  const row = el("div", "row");
  row.id = "row-" + entry.id;

  const head = el("div", "rowhead");
  head.appendChild(statusTag(entry, true));
  head.appendChild(el("span", "rtitle", titleOf(entry)));
  row.appendChild(head);

  const meta = el("div", "rowmeta");
  const where = [entry.repo, entry.worktree].filter(Boolean).join("/");
  if (where) metaText(meta, where + (entry.branch ? " · " + entry.branch : ""));
  for (const c of entry.commits || []) {
    if (meta.childNodes.length) metaSep(meta);
    metaText(meta, String(c).slice(0, 7));
  }
  for (const t of entry.tags || []) {
    if (meta.childNodes.length) metaSep(meta);
    metaText(meta, "#" + t);
  }
  if (meta.childNodes.length) metaSep(meta);
  metaText(meta, fmtStamp(entry.updated));
  row.appendChild(meta);

  if (entry.summary) row.appendChild(el("div", "rsummary", entry.summary));
  const assets = assetsLine(entry);
  if (assets) row.appendChild(assets);

  const files = entry.files || [];
  if (files.length || entry.patch) {
    const line = el("div", "rowline");
    if (files.length) {
      const open = state.openFiles.has(entry.id);
      const toggle = el("button", "filestoggle" + (open ? " open" : ""));
      toggle.appendChild(el("span", "car", "▸"));
      toggle.appendChild(el("span", null, files.length + (files.length === 1 ? " file" : " files")));
      toggle.onclick = () => {
        if (open) state.openFiles.delete(entry.id);
        else state.openFiles.add(entry.id);
        render();
      };
      line.appendChild(toggle);
    }
    if (entry.patch) {
      const btn = el("button", "btn ghost", "patch");
      btn.onclick = () => openPatch(entry);
      line.appendChild(btn);
    }
    row.appendChild(line);
    if (files.length && state.openFiles.has(entry.id)) {
      const list = el("ul", "files");
      for (const f of files) list.appendChild(el("li", null, f));
      row.appendChild(list);
    }
  }

  const linked = state.experiments.filter((e) => (e.diff_ids || []).includes(entry.id));
  if (linked.length) {
    const line = el("div", "rowline");
    line.appendChild(el("span", "label", "experiments"));
    for (const exp of linked) line.appendChild(refChip(exp));
    row.appendChild(line);
  }

  row.appendChild(editableBlock(entry, "notes", "review notes"));
  return row;
}

function expRow(entry) {
  const row = el("div", "row");
  row.id = "row-" + entry.id;

  const head = el("div", "rowhead");
  const tag = statusTag(entry, true);
  const jobs = (entry.job_ids || []).filter(Boolean);
  // job ids are tooltip-only: never visible text
  if (jobs.length) tag.title = "job " + jobs.join(", ") + " — click to change status";
  head.appendChild(tag);
  head.appendChild(el("span", "rtitle", titleOf(entry)));
  row.appendChild(head);

  const meta = el("div", "rowmeta");
  if (entry.cluster) metaText(meta, entry.cluster);
  (entry.wandb || []).forEach((url, i) => {
    if (meta.childNodes.length) metaSep(meta);
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noreferrer";
    a.textContent = "wandb" + ((entry.wandb || []).length > 1 ? " " + (i + 1) : "") + " ↗";
    a.title = url + (jobs.length ? "  (job " + jobs.join(", ") + ")" : "");
    meta.appendChild(a);
  });
  for (const t of entry.tags || []) {
    if (meta.childNodes.length) metaSep(meta);
    metaText(meta, "#" + t);
  }
  if (meta.childNodes.length) metaSep(meta);
  metaText(meta, fmtStamp(entry.updated));
  row.appendChild(meta);

  if (entry.summary) row.appendChild(el("div", "rsummary", entry.summary));
  const assets = assetsLine(entry);
  if (assets) row.appendChild(assets);

  const diffIds = entry.diff_ids || [];
  if (diffIds.length) {
    const line = el("div", "rowline");
    line.appendChild(el("span", "label", "diffs"));
    for (const id of diffIds) line.appendChild(refChip(state.byId.get(id)));
    row.appendChild(line);
  }

  const metrics = metricsBlock(entry);
  if (metrics) row.appendChild(metrics);

  row.appendChild(editableBlock(entry, "results", "results"));
  return row;
}

function subList(label, entries, makeRow) {
  const box = el("div", "sublist");
  const head = el("div", "sublabel");
  head.appendChild(el("span", "label", label));
  head.appendChild(el("span", "n", String(entries.length)));
  box.appendChild(head);
  for (const entry of entries) box.appendChild(makeRow(entry));
  return box;
}

function questionSection(question, diffs, exps) {
  const section = el("section", "q");
  section.id = "q-section-" + question.id;

  const head = el("div", "qhead");
  const collapsed = state.collapsed.has(question.id);
  const chev = el("button", "chev" + (collapsed ? "" : " open"));
  chev.appendChild(el("span", "car", "▸"));
  chev.title = collapsed ? "expand" : "collapse";
  chev.onclick = () => {
    if (collapsed) state.collapsed.delete(question.id);
    else state.collapsed.add(question.id);
    render();
  };
  head.appendChild(chev);

  const main = el("div", "qmain");
  main.appendChild(el("h2", "qtitle", question.title || "untitled question"));
  const line = el("div", "qline");
  line.appendChild(statusTag(question, true));
  const wt = worktreeOfQuestion(question.id);
  if (wt) line.appendChild(wtChip(wt));
  line.appendChild(el("span", "qid", "updated " + fmtStamp(question.updated)));
  for (const t of question.tags || []) line.appendChild(el("span", "tag", "#" + t));
  main.appendChild(line);
  head.appendChild(main);
  section.appendChild(head);

  if (collapsed) {
    const fold = el("div", "qfold");
    const nTakeaways = listField(question, "takeaways").length;
    let counts = diffs.length + " diffs · " + exps.length + " experiments";
    if (nTakeaways) counts += " · " + nTakeaways + " takeaways";
    fold.appendChild(el("span", "counts", counts));
    fold.appendChild(el("span", "oneline", firstLine(question.conclusion) || "no conclusion yet"));
    section.appendChild(fold);
    return section;
  }

  if (question.summary) section.appendChild(el("p", "qsummary", question.summary));
  section.appendChild(editableBlock(question, "conclusion", "conclusion", "conclusion"));
  section.appendChild(editableBlock(question, "takeaways", "takeaways", "takeaways", true));
  const qassets = assetsLine(question);
  if (qassets) section.appendChild(qassets);
  if (diffs.length) section.appendChild(subList("diffs", diffs, diffRow));
  if (exps.length) section.appendChild(subList("experiments", exps, expRow));
  if (!diffs.length && !exps.length) {
    const note = anyFilterActive() ? "no children match the filters" : "no diffs or experiments yet";
    section.appendChild(el("div", "none", note));
  }
  return section;
}

function unassignedSection(diffs, exps) {
  const section = el("section", "q");
  section.id = "q-section-unassigned";
  const head = el("div", "qhead");
  const collapsed = state.collapsed.has(UNASSIGNED);
  const chev = el("button", "chev" + (collapsed ? "" : " open"));
  chev.appendChild(el("span", "car", "▸"));
  chev.onclick = () => {
    if (collapsed) state.collapsed.delete(UNASSIGNED);
    else state.collapsed.add(UNASSIGNED);
    render();
  };
  head.appendChild(chev);
  const main = el("div", "qmain");
  main.appendChild(el("h2", "qtitle unassigned", "unassigned"));
  const line = el("div", "qline");
  line.appendChild(el("span", "qid", "not linked to a research question"));
  main.appendChild(line);
  head.appendChild(main);
  section.appendChild(head);
  if (collapsed) {
    const fold = el("div", "qfold");
    fold.appendChild(el("span", "counts", diffs.length + " diffs · " + exps.length + " experiments"));
    section.appendChild(fold);
    return section;
  }
  if (diffs.length) section.appendChild(subList("diffs", diffs, diffRow));
  if (exps.length) section.appendChild(subList("experiments", exps, expRow));
  if (!diffs.length && !exps.length) section.appendChild(el("div", "none", "nothing unassigned right now"));
  return section;
}

async function openPatch(entry) {
  const bg = el("div", "modalbg");
  const modal = el("div", "modal");
  const head = el("div", "modalhead");
  head.appendChild(el("span", "t", titleOf(entry)));
  head.appendChild(el("span", "stamp", fmtStamp(entry.updated)));
  const dismiss = () => {
    bg.remove();
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (ev) => {
    if (ev.key === "Escape") dismiss();
  };
  const close = el("button", "btn", "close");
  close.onclick = dismiss;
  head.appendChild(close);
  modal.appendChild(head);
  const pre = el("pre", "patch mono", "loading patch…");
  modal.appendChild(pre);
  bg.appendChild(modal);
  bg.onclick = (ev) => {
    if (ev.target === bg) dismiss();
  };
  document.body.appendChild(bg);
  document.addEventListener("keydown", onKey);

  try {
    const res = await api("/api/patch/" + encodeURIComponent(entry.id));
    const text = await res.text();
    pre.textContent = "";
    for (const raw of text.split("\n")) {
      let cls = "ln";
      if (raw.startsWith("+++") || raw.startsWith("---")) cls += " dim";
      else if (raw.startsWith("+")) cls += " add";
      else if (raw.startsWith("-")) cls += " del";
      else if (raw.startsWith("@@")) cls += " hunk";
      else if (raw.startsWith("diff --git") || raw.startsWith("index ")) cls += " file";
      pre.appendChild(el("span", cls, raw || " "));
    }
  } catch (err) {
    pre.textContent = "could not load patch: " + (err.message || err);
  }
}

// ---- left pane: question navigation -------------------------------------------

// ---- worktree color coding ----------------------------------------------------
// muted hues that sit on the paper and stay clear of the status colors; assigned by name hash so a
// worktree keeps its color across sessions; the chip always carries the name (never color alone)
const WT_PALETTE = ["#2F6F7E", "#6B4C8A", "#3D5A99", "#B4632B", "#6B7A2B", "#9A3F6E", "#7A5230", "#4F6D7A"];

function wtColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return WT_PALETTE[h % WT_PALETTE.length];
}

function worktreeOfQuestion(qid) {
  const counts = new Map();
  for (const d of state.diffs) {
    if (qidOf(d) !== qid || !d.worktree) continue;
    counts.set(d.worktree, (counts.get(d.worktree) || 0) + 1);
  }
  let best = null;
  for (const [name, n] of counts) if (!best || n > best[1]) best = [name, n];
  return best ? best[0] : null;
}

function wtChip(name) {
  const chip = el("span", "wtchip");
  const sw = el("span", "sw");
  sw.style.background = wtColor(name);
  chip.appendChild(sw);
  chip.appendChild(el("span", null, name));
  chip.title = "worktree " + name;
  return chip;
}

function navItem(key, opts) {
  const item = el("button", "navitem" + (state.selected === key ? " on" : "") + (opts.muted ? " muted" : ""));
  if (opts.worktree) item.style.borderLeftColor = wtColor(opts.worktree);
  const head = el("div", "navhead");
  if (opts.glyph) head.appendChild(el("span", "navglyph", opts.glyph));
  else head.appendChild(el("span", "dot " + opts.dotClass));
  head.appendChild(el("div", "navtitle", opts.title));
  item.appendChild(head);
  if (opts.count || opts.worktree) {
    const count = el("div", "navcount");
    if (opts.worktree) count.appendChild(wtChip(opts.worktree));
    if (opts.count) count.appendChild(el("span", null, opts.count));
    item.appendChild(count);
  }
  item.onclick = () => setSelected(key);
  return item;
}

function renderNav() {
  navEl.textContent = "";
  navEl.appendChild(
    navItem(null, { glyph: "⌂", title: "feed", muted: !!state.selected })
  );
  navEl.appendChild(el("div", "navrule"));

  let shown = 0;
  for (const question of state.questions) {
    if (!passesStatus(question)) continue;
    const kids = childrenOf(question.id);
    const hit =
      matchesSearch(question) || kids.diffs.some(matchesSearch) || kids.exps.some(matchesSearch);
    if (!hit) continue;
    const nDiffs = kids.diffs.filter(passesStatus).length;
    const nExps = kids.exps.filter(passesStatus).length;
    const nTakeaways = listField(question, "takeaways").length;
    const bits = [plural(nDiffs, "diff"), plural(nExps, "run")];
    if (nTakeaways) bits.push(plural(nTakeaways, "takeaway"));
    navEl.appendChild(
      navItem(question.id, {
        dotClass: statusClass(question),
        title: question.title || "untitled question",
        count: bits.join(" · "),
        worktree: worktreeOfQuestion(question.id),
      })
    );
    shown++;
  }

  const loose = looseChildren();
  if (loose.diffs.length || loose.exps.length) {
    navEl.appendChild(
      navItem(UNASSIGNED, {
        dotClass: "st-unreviewed",
        title: "unassigned",
        count: plural(loose.diffs.length, "diff") + " · " + plural(loose.exps.length, "run"),
        muted: true,
      })
    );
    shown++;
  }

  if (!shown) {
    navEl.appendChild(
      el("div", "navnone", state.byId.size ? "no questions match" : "the ledger is empty")
    );
  }
}

// ---- right pane: feed overview ------------------------------------------------

function feedItem(entry, withSnippet) {
  const item = el("button", "feeditem");
  item.appendChild(el("span", "dot " + statusClass(entry)));
  item.appendChild(el("span", "fititle", titleOf(entry)));
  if (withSnippet) {
    const snip = firstLine(entry.results) || firstLine(entry.summary);
    if (snip) item.appendChild(el("span", "fisnip", snip));
  }
  item.appendChild(el("span", "fitime", relStamp(entry.updated)));
  item.title = labelOf(entry) + " · " + fmtStamp(entry.updated);
  item.onclick = () => scrollToEntry(entry.id);
  return item;
}

function feedColumn(label, entries, withSnippet) {
  const col = el("div", "feedcol");
  const head = el("div", "sublabel");
  head.appendChild(el("span", "label", label));
  head.appendChild(el("span", "n", String(entries.length)));
  col.appendChild(head);
  if (!entries.length) {
    col.appendChild(el("div", "none", "nothing here yet"));
    return col;
  }
  for (const entry of entries.slice(0, FEED_LIMIT)) col.appendChild(feedItem(entry, withSnippet));
  return col;
}

function feedView(host) {
  const visible = (entry) => passesStatus(entry) && matchesSearch(entry);
  const exps = state.experiments.filter(visible);
  const diffs = state.diffs.filter(visible);
  if (!exps.length && !diffs.length) {
    const empty = el("div", "empty");
    empty.appendChild(el("span", "glyph", "∅"));
    empty.appendChild(
      el("span", null, state.byId.size ? "nothing matches the current filters." : "the ledger is empty.")
    );
    host.appendChild(empty);
    return;
  }
  const grid = el("div", "feedgrid");
  grid.appendChild(feedColumn("recent experiments", exps, true));
  grid.appendChild(feedColumn("recent diffs", diffs, false));
  host.appendChild(grid);
  host.appendChild(el("div", "feednote", "select a question on the left for detail"));
}

// ---- render -------------------------------------------------------------------

function render() {
  renderFilters();
  const total = state.byId.size;
  stampEl.textContent = state.error
    ? "error: " + state.error
    : "updated " + (fmtStamp(state.generated) || "—") + " · " + total + " entries";

  const navScroll = navEl.scrollTop;
  const detailScroll = detailEl.scrollTop;

  renderNav();

  detailEl.textContent = "";
  const inner = el("div", "detailinner");
  detailEl.appendChild(inner);

  const question = state.selected && state.selected !== UNASSIGNED ? state.byId.get(state.selected) : null;
  const isFeed = !state.selected;
  detailEl.classList.toggle("feedmode", isFeed);

  if (isFeed) {
    feedView(inner);
  } else if (state.selected === UNASSIGNED) {
    const loose = looseChildren();
    inner.appendChild(unassignedSection(loose.diffs, loose.exps));
  } else if (question && question.kind === "question") {
    const kids = childrenOf(question.id);
    inner.appendChild(
      questionSection(question, kids.diffs.filter(passesStatus), kids.exps.filter(passesStatus))
    );
  } else {
    const empty = el("div", "empty");
    empty.appendChild(el("span", "glyph", total ? "∅" : "…"));
    empty.appendChild(el("span", null, total ? "that question is not in the ledger." : "loading…"));
    inner.appendChild(empty);
  }

  navEl.scrollTop = navScroll;
  detailEl.scrollTop = detailScroll;
  drawCharts(); // charts need a measured width, so they draw after the tree is in the document
}

searchEl.addEventListener("input", () => {
  state.search = searchEl.value;
  render();
});
document.getElementById("refresh").addEventListener("click", () => loadData(true));
document.addEventListener("keydown", (ev) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
    ev.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
});

setInterval(() => {
  const active = document.activeElement;
  if (active && active.tagName === "TEXTAREA") return;
  if (state.editing) return;
  if (document.querySelector(".modalbg") || document.querySelector(".popover")) return;
  loadData(false);
}, 60000);

state.selected = hashKey();
loadData(false);
